<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <style>
    <![CDATA[
    /* Canvas & Base Geometry */
    .bg { fill: #020406; stroke: #334155; stroke-width: 1.5; }
    
    /* Outlined High-Contrast Top Tab Header */
    .header-box { 
      fill: #0a111a; 
      stroke: #38bdf8; 
      stroke-width: 1.5; 
    }
    .header-divider { 
      stroke: #00f0ff; 
      stroke-width: 1; 
      opacity: 0.9;
    }
    
    /* Control Dots */
    .dot { stroke-width: 0; }
    .dot-red { fill: #ff3366; }
    .dot-yellow { fill: #f59e0b; }
    .dot-green { fill: #00ff66; }
    
    /* Typography */
    .title {
      font-family: 'Fira Code', 'Geist Mono', Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-anchor: middle;
    }
    
    .terminal-text {
      font-family: 'Fira Code', 'Geist Mono', Consolas, monospace;
      font-size: 13px;
      fill: #cbd5e1;
    }
    
    .prompt { fill: #00f0ff; font-weight: bold; }
    .cmd { fill: #00ff66; }
    .accent { fill: #00f0ff; }
    .string { fill: #93c5fd; }
    .keyword { fill: #f43f5e; }
    
    /* Sequential Animations */
    .line {
      opacity: 0;
      animation: fadeInLine 0.18s ease-out forwards;
    }
    
    .cursor {
      fill: #00f0ff;
      opacity: 0;
      animation: cursorBlink 0.9s infinite;
      animation-delay: 1.65s;
    }
    
    @keyframes fadeInLine {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    
    .l1  { animation-delay: 0.15s; }
    .l2  { animation-delay: 0.25s; }
    .l3  { animation-delay: 0.35s; }
    .l4  { animation-delay: 0.45s; }
    .l5  { animation-delay: 0.55s; }
    .l6  { animation-delay: 0.65s; }
    .l7  { animation-delay: 0.75s; }
    .l8  { animation-delay: 0.85s; }
    .l9  { animation-delay: 0.95s; }
    .l10 { animation-delay: 1.05s; }
    .l11 { animation-delay: 1.15s; }
    .l12 { animation-delay: 1.25s; }
    .l13 { animation-delay: 1.35s; }
    .l14 { animation-delay: 1.45s; }
    .l15 { animation-delay: 1.60s; }
    ]]>
  </style>
  
  <!-- Outer Terminal Window Frame -->
  <rect x="0.75" y="0.75" width="718.5" height="398.5" class="bg" />
  
  <!-- Explicit Outlined Top Header Container -->
  <rect x="0.75" y="0.75" width="718.5" height="34" class="header-box" />
  <line x1="0.75" y1="34.75" x2="719.25" y2="34.75" class="header-divider" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="18" r="5" class="dot dot-red" />
  <circle cx="36" cy="18" r="5" class="dot dot-yellow" />
  <circle cx="52" cy="18" r="5" class="dot dot-green" />
  
  <!-- Header Title -->
  <text x="360" y="22" class="title">
    <tspan fill="#00f0ff">lh-exe</tspan><tspan fill="#64748b">@</tspan><tspan fill="#e2e8f0">hexcent-core</tspan><tspan fill="#64748b">:~</tspan>
  </text>
  
  <!-- Shell Body -->
  <g transform="translate(24, 62)" class="terminal-text">
    <!-- Command Line -->
    <g class="line l1">
      <text x="0" y="0"><tspan class="prompt">lh-exe@hexcent:~$</tspan> <tspan class="cmd">cat system_manifest.json</tspan></text>
    </g>
    
    <!-- JSON Content -->
    <g class="line l2">
      <text x="0" y="22"><tspan class="keyword">{</tspan></text>
    </g>
    <g class="line l3">
      <text x="18" y="44"><tspan class="accent">"operator"</tspan>: <tspan class="string">"Lin Han"</tspan>,</text>
    </g>
    <g class="line l4">
      <text x="18" y="66"><tspan class="accent">"specialization"</tspan>: <tspan class="keyword">[</tspan><tspan class="string">"Cybersecurity"</tspan>, <tspan class="string">"Finance"</tspan>, <tspan class="string">"Full-Stack"</tspan><tspan class="keyword">]</tspan>,</text>
    </g>
    <g class="line l5">
      <text x="18" y="88"><tspan class="accent">"languages"</tspan>: <tspan class="keyword">[</tspan></text>
    </g>
    <g class="line l6">
      <text x="36" y="110"><tspan class="string">"Python"</tspan>, <tspan class="string">"C++"</tspan>, <tspan class="string">"C"</tspan>, <tspan class="string">"TypeScript"</tspan>, <tspan class="string">"JavaScript"</tspan>,</text>
    </g>
    <g class="line l7">
      <text x="36" y="132"><tspan class="string">"Java"</tspan>, <tspan class="string">"OCaml"</tspan>, <tspan class="string">"Lua"</tspan>, <tspan class="string">"Pine Script"</tspan>, <tspan class="string">"SQL"</tspan></text>
    </g>
    <g class="line l8">
      <text x="18" y="154"><tspan class="keyword">]</tspan>,</text>
    </g>
    <g class="line l9">
      <text x="18" y="176"><tspan class="accent">"active_deployments"</tspan>: <tspan class="keyword">{</tspan></text>
    </g>
    <g class="line l10">
      <text x="36" y="198"><tspan class="accent">"hub"</tspan>: <tspan class="string">"HexCent // personal portfolio &amp; project platform"</tspan>,</text>
    </g>
    <g class="line l11">
      <text x="36" y="220"><tspan class="accent">"quant_engine"</tspan>: <tspan class="string">"Hexnet v3.0 // quantitative strategy backtester"</tspan></text>
    </g>
    <g class="line l12">
      <text x="18" y="242"><tspan class="keyword">}</tspan>,</text>
    </g>
    <g class="line l13">
      <text x="18" y="264"><tspan class="accent">"status"</tspan>: <tspan class="string">"nominal // active deployment"</tspan></text>
    </g>
    <g class="line l14">
      <text x="0" y="286"><tspan class="keyword">}</tspan></text>
    </g>
    
    <!-- Final Prompt with Delayed Blinking Cursor -->
    <g class="line l15">
      <text x="0" y="312"><tspan class="prompt">lh-exe@hexcent:~$</tspan></text>
      <rect x="148" y="300" width="8" height="15" class="cursor" />
    </g>
  </g>
</svg>
